name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          rm -rf /tmp/flutter_wrapper
          flutter create --platforms=android --no-pub /tmp/flutter_wrapper
          cp /tmp/flutter_wrapper/android/gradlew android/gradlew
          cp /tmp/flutter_wrapper/android/gradlew.bat android/gradlew.bat
          rm -rf android/gradle/wrapper
          mkdir -p android/gradle
          cp -R /tmp/flutter_wrapper/android/gradle/wrapper android/gradle/wrapper
          chmod +x android/gradlew
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navar-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
